name: Local K8s Deploy
on:
  push:
    branches: [dev]
defaults:
  run:
    shell: bash
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure namespace
        run: kubectl create namespace demo-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Build & push image (kaniko Job)
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          # Build context from the checked-out demo/ via ConfigMap
          kubectl create configmap demo-context -n ci \
            --from-file=Dockerfile=demo/Dockerfile \
            --from-file=main.go=demo/main.go \
            --from-file=go.mod=demo/go.mod \
            --dry-run=client -o yaml | kubectl apply -f -
          # Run the build in an isolated kaniko Job so the runner pod stays light
          kubectl delete job build-demo -n ci --ignore-not-found
          sed "s|192.168.3.49:30500/demo-app:\${TAG}|192.168.3.49:30500/demo-app:${TAG}|" ci/kaniko-build-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/build-demo -n ci --timeout=300s \
            || { echo "kaniko job failed:"; kubectl logs job/build-demo -n ci --tail=30; kubectl delete job build-demo -n ci --ignore-not-found; exit 1; }
          kubectl delete job build-demo -n ci --ignore-not-found

      - name: Deploy to K8s
        run: |
          TAG="dev-${GITHUB_SHA::7}"
          sed -i "s|image: 192.168.3.49:30500/demo-app:.*|image: 192.168.3.49:30500/demo-app:${TAG}|" demo/k8s/deployment.yaml
          kubectl apply -f demo/k8s/deployment.yaml -n demo-dev

      - name: Wait for rollout
        run: kubectl rollout status deployment/demo-app -n demo-dev --timeout=90s

      - name: Health check
        run: |
          kubectl port-forward -n demo-dev svc/demo-app 8080:8080 & PF=$!
          sleep 3
          curl -s --retry 5 --retry-connrefused http://localhost:8080/health
          kill $PF 2>/dev/null || true
